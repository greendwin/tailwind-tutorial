<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>09.2 · Sticky & modal</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <!--
    EXERCISE 09.2: Sticky header & modal (see lessons/09-positioning.md)
    1. sticky translucent header   2. sticky TOC   3. fixed modal above everything
  -->
  <body class="bg-white text-slate-700">
    <header class="flex items-center border-b border-slate-200 px-6 py-3">
      <span class="font-bold text-slate-900">Docs</span>
      <button id="open" class="ml-auto rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-semibold text-white">Open modal</button>
    </header>

    <div class="mx-auto flex max-w-5xl items-start gap-10 px-6 py-10">
      <aside class="w-48 shrink-0">
        <p class="text-xs font-semibold text-slate-500 uppercase">On this page</p>
        <ul class="mt-3 space-y-2 text-sm">
          <li><a href="#a">Introduction</a></li>
          <li><a href="#b">Installation</a></li>
          <li><a href="#c">Usage</a></li>
        </ul>
      </aside>

      <article class="flex-1 space-y-6">
        <h1 id="a" class="text-3xl font-bold text-slate-900">Introduction</h1>
        <div class="h-96 rounded-xl bg-slate-100"></div>
        <h2 id="b" class="text-2xl font-bold text-slate-900">Installation</h2>
        <div class="h-96 rounded-xl bg-slate-100"></div>
        <h2 id="c" class="text-2xl font-bold text-slate-900">Usage</h2>
        <div class="h-96 rounded-xl bg-slate-100"></div>
        <div class="h-96 rounded-xl bg-slate-100"></div>
      </article>
    </div>

    <!-- MODAL: backdrop + centered dialog.
         The script adds a `data-open` attribute when open and removes it when closed.
         Make it hidden by default and visible (grid or flex) only when data-open is present. -->
    <div id="modal">
      <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl">
        <h2 class="text-lg font-bold text-slate-900">Delete project?</h2>
        <p class="mt-2 text-sm text-slate-600">This action cannot be undone.</p>
        <div class="mt-6 flex justify-end gap-3">
          <button id="close" class="rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-700">Cancel</button>
          <button class="rounded-lg bg-red-600 px-3 py-1.5 text-sm font-semibold text-white">Delete</button>
        </div>
      </div>
    </div>

    <script>
      // JS only flips state; your classes decide what that state looks like.
      const modal = document.getElementById("modal");
      document.getElementById("open").onclick = () => modal.toggleAttribute("data-open", true);
      document.getElementById("close").onclick = () => modal.toggleAttribute("data-open", false);
    </script>
  </body>
</html>
