<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10.1 · Dark profile</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <!--
    EXERCISE 10.1: Dark-ify a card (see lessons/10-dark-mode.md)
    Add dark: classes. Test with DevTools → Ctrl+Shift+P → "Emulate CSS prefers-color-scheme: dark".
  -->
  <body class="grid min-h-screen place-items-center bg-slate-100 p-6">
    <div class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-slate-900/5">
      <div class="h-24 bg-linear-to-r from-violet-500 to-fuchsia-500"></div>
      <div class="-mt-10 px-6 pb-6">
        <div class="size-20 rounded-full bg-violet-200 ring-4 ring-white"></div>
        <h2 class="mt-3 text-xl font-bold text-slate-900">Margaret Hamilton</h2>
        <p class="text-sm text-slate-500">Software engineer · Boston</p>
        <p class="mt-4 text-slate-600">Led the team that wrote the on-board flight software for the Apollo missions.</p>

        <div class="mt-4 flex flex-wrap gap-2">
          <span class="rounded-full bg-violet-50 px-2.5 py-0.5 text-xs font-medium text-violet-700 ring-1 ring-violet-600/20">Apollo</span>
          <span class="rounded-full bg-violet-50 px-2.5 py-0.5 text-xs font-medium text-violet-700 ring-1 ring-violet-600/20">NASA</span>
          <span class="rounded-full bg-violet-50 px-2.5 py-0.5 text-xs font-medium text-violet-700 ring-1 ring-violet-600/20">Systems</span>
        </div>

        <div class="mt-6 grid grid-cols-3 divide-x divide-slate-200 border-y border-slate-200 py-3 text-center">
          <div>
            <p class="font-bold text-slate-900">42</p>
            <p class="text-xs text-slate-500">Projects</p>
          </div>
          <div>
            <p class="font-bold text-slate-900">9.1k</p>
            <p class="text-xs text-slate-500">Followers</p>
          </div>
          <div>
            <p class="font-bold text-slate-900">318</p>
            <p class="text-xs text-slate-500">Following</p>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button class="flex-1 rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white">Follow</button>
          <button class="flex-1 rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-900 ring-1 ring-slate-300">Message</button>
        </div>
      </div>
    </div>
  </body>
</html>
