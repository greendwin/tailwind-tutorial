<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10.1 · Dark profile</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 10.1: Dark-ify a card (see lessons/10-dark-mode.md)
    Add dark: classes. Test with DevTools → Ctrl+Shift+P → "Emulate CSS prefers-color-scheme: dark".
  -->

<body class="
    grid min-h-screen place-items-center bg-slate-100 p-6
    dark:bg-slate-950
  ">
  <div class="
      w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-slate-900/5
      dark:bg-slate-900 dark:ring-white/10
  ">
    <div class="
        h-24 bg-linear-to-r from-violet-500 to-fuchsia-500
        dark:from-violet-700 dark:to-fuchsia-700
    "></div>
    <div class="-mt-10 px-6 pb-6">
      <div class="
          size-20 rounded-full bg-violet-200 ring-4 ring-white
          dark:bg-violet-950 dark:ring-slate-900
      "></div>
      <h2 class="
          mt-3 text-xl font-bold text-slate-900
          dark:text-white
      ">Margaret Hamilton</h2>
      <p class="
          text-sm text-slate-500
          dark:text-slate-400
      ">Software engineer · Boston</p>
      <p class="
          mt-4 text-slate-600
          dark:text-slate-300
      ">Led the team that wrote the on-board flight software for the Apollo missions.</p>

      <div class="
          mt-4 flex flex-wrap gap-2
          text-xs font-medium text-violet-700 
          dark:text-violet-300
          *:rounded-full
          *:bg-violet-50 *:px-2.5 *:py-0.5 *:ring-1 *:ring-violet-600/20
          *:dark:bg-violet-950 *:dark:ring-violet-400/20
      ">
        <span>Apollo</span>
        <span>NASA</span>
        <span>Systems</span>
      </div>

      <div class="
          mt-6 grid grid-cols-3 divide-x
          divide-slate-200 border-y
          border-slate-200 py-3 text-center
          dark:divide-white/10
          dark:border-white/10
      ">
        <div>
          <p class="font-bold text-slate-900 dark:text-white">42</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">Projects</p>
        </div>
        <div>
          <p class="font-bold text-slate-900 dark:text-white">9.1k</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">Followers</p>
        </div>
        <div>
          <p class="font-bold text-slate-900 dark:text-white">318</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">Following</p>
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button class="
            flex-1 rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white
            dark:bg-violet-500 dark:text-slate-950
        ">Follow</button>
        <button class="
            flex-1 rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-900 ring-1 ring-slate-300
            dark:bg-slate-900 dark:text-white dark:ring-slate-600
        ">Message</button>
      </div>
    </div>
  </div>
</body>

</html>
