<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05.3 · Page layout</title>

<!--
    EXERCISE 05.3: Page with sticky footer (see lessons/05-flexbox.md)
    Footer at the bottom when content is short; after the content when it's long. Flexbox only.
  -->

<body class="min-h-svh flex flex-col">
  <header class="bg-slate-900 px-6 py-4 font-bold text-white">My Site</header>

  <main class="flex-1 px-6 py-8">
    <h1 class="text-2xl font-bold">Short page</h1>
    <p class="mt-2 text-slate-600">There's not much content here, but the footer should still be at the bottom.</p>
  </main>

  <footer class="border-t border-slate-200 bg-slate-50 px-6 py-4 text-sm text-slate-500">© 2026 My Site</footer>
</body>

</html>
