<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06.2 · App shell</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 06.2: App shell (see lessons/06-grid.md)
    ONE grid on #shell: topbar across the top, 16rem sidebar, main fills the rest.
    Cards: auto-fill with a 14rem minimum. No breakpoints.
  -->

<body>
  <div id="shell" class="
      h-dvh grid grid-cols-[16rem_1fr]
      grid-rows-[auto_1fr]
  ">
    <header class="
        col-span-full
        border-b border-slate-200 bg-white px-6 py-3 font-bold
    ">Dashboard</header>

    <aside class="border-r border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">
      <p class="font-semibold">Overview</p>
      <p>Projects</p>
      <p>Team</p>
      <p>Settings</p>
    </aside>

    <main class="
        overflow-auto
        bg-slate-100 p-6
    ">
      <div class="
          grid gap-3
          grid-cols-[repeat(auto-fill,minmax(14rem,1fr))]
      ">
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Alpha</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Beta</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Gamma</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Delta</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Epsilon</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Zeta</div>
        <div class="rounded-xl bg-white p-5 shadow-sm">Project Eta</div>
      </div>
    </main>
  </div>
</body>

</html>
