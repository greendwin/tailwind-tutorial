<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06.1 · Bento</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 06.1: Bento gallery (see lessons/06-grid.md)
    4 columns. A = 2x2, D = 2 wide, F = 2 tall. Result: a solid 4x4 rectangle.
  -->

<body class="bg-slate-900 p-8">
  <div class="
        mx-auto max-w-4xl
        grid grid-cols-4 gap-8 auto-rows-18
        *:rounded-2xl *:flex *:items-center *:justify-center
        text-3xl font-bold text-white
    ">
    <div class="col-span-2 row-span-2 bg-linear-to-br from-indigo-500 to-purple-600">
      A
    </div>
    <div class="bg-slate-700">B</div>
    <div class="bg-slate-700">C</div>
    <div class="col-span-2 bg-linear-to-r from-amber-400 to-orange-500">D
    </div>
    <div class="bg-slate-700">E</div>
    <div class="row-span-2 bg-linear-to-b from-emerald-400 to-teal-600">F
    </div>
    <div class="bg-slate-700">G</div>
    <div class="bg-slate-700">H</div>
    <div class="bg-slate-700">I</div>
    <div class="bg-slate-700">J</div>
    <div class="bg-slate-700">K</div>
  </div>
</body>

</html>
