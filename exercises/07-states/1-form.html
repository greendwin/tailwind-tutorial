<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07.1 · Form</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 07.1: Sign-up form (see lessons/07-states.md)
    Focus, hover, active, disabled, user-invalid, peer, accent, file:
  -->

<body class="bg-slate-50 p-10">
  <form class="
      mx-auto max-w-md space-y-5 rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-900/5
  " onsubmit="return false">
    <h1 class="text-2xl font-bold text-slate-900">Create account</h1>

    <div>
      <label for="name" class="block text-sm font-medium text-slate-700">Full name</label>
      <input id="name" type="text" placeholder="Jane Doe" class="
          rounded-xs
          ring-1 ring-slate-300
          placeholder-indigo-400
          mt-1 w-full px-3 py-2
          focus:ring-2 focus:ring-indigo-600
          outline-hidden transition-colors
      " />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
      <input id="email" type="email" required placeholder="jane@example.com" class="
          peer
          rounded-xs
          ring-1 ring-slate-300
          placeholder-indigo-400
          mt-1 w-full px-3 py-2
          user-invalid:ring-red-400
          focus:ring-2 focus:user-valid:ring-indigo-600
          outline-hidden transition-colors
      " />
      <p class="
          hidden
          peer-user-invalid:block
          mt-1 text-sm text-red-600
      ">Please enter a valid email address.</p>
    </div>

    <div>
      <label for="avatar" class="block text-sm font-medium text-slate-700">Avatar</label>
      <input id="avatar" type="file" class="
          mt-1 block w-full text-sm text-slate-500
          file:text-indigo-500
          file:bg-indigo-50
          file:px-3 file:py-1 file:rounded-full
          file:border file:border-indigo-100
          file:mr-2
          outline-hidden rounded-xs
          focus-visible:ring-2
          focus-visible:ring-offset-1
          focus-visible:ring-indigo-600
      " />
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input type="checkbox" class="
          size-4
          accent-indigo-600
          outline-hidden
          focus-visible:ring-2 
          focus-visible:ring-offset-1
          focus-visible:ring-indigo-600
      " />
      I agree to the terms
    </label>

    <button type="submit" class="
        w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white
        hover:bg-indigo-700 active:bg-indigo-800
        focus-visible:outline-indigo-800
        disabled:bg-indigo-300 disabled:cursor-not-allowed
        cursor-pointer transition-colors
    ">Create account</button>
  </form>
</body>

</html>
