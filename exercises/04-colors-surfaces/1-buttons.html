<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04.1 · Buttons</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 04.1: Button gallery (see lessons/04-colors-surfaces.md)
    Same size for all; only the "skin" changes. No hover states yet.
  -->

<body class="bg-slate-50 p-10">
  <div class="
      flex flex-wrap items-center gap-4
  ">
    <button class="
        px-3 py-1
        bg-indigo-500 text-white
        shadow-md rounded cursor-pointer
    ">
      Primary
    </button>
    <button class="
        px-3 py-1
        bg-white text-slate-700
        ring-2 ring-slate-500/20
        shadow-md rounded cursor-pointer
    ">
      Secondary
    </button>
    <button class="
        px-3 py-1
        bg-amber-300/10 text-amber-900
        ring-1 ring-amber-300/30
        shadow rounded cursor-pointer
    ">
      Soft
    </button>
    <button class="
        px-3 py-1
        ring-2 ring-mauve-500 
        text-mauve-700
        rounded cursor-pointer
    ">
      Outline
    </button>
    <button class="
        px-3 py-1
        bg-red-500 text-white
        shadow-md
        rounded cursor-pointer
    ">
      Danger
    </button>
    <button class="
        px-4 py-1
        bg-indigo-500 text-white
        shadow-md
        rounded-full cursor-pointer
    ">
      Pill
    </button>
    <button class="
        px-3 py-1
        bg-linear-to-r
        from-amber-300
        via-emerald-200
        to-fuchsia-200
        text-sky-950
        rounded cursor-pointer
        shadow-md shadow-sky-500/50
    ">
      Gradient
    </button>
    <button class="
        px-3 py-1
        bg-indigo-500
        text-white
        opacity-40
        rounded cursor-not-allowed
    ">
      Disabled
    </button>
  </div>
</body>

</html>
