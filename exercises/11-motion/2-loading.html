<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11.2 · Loading states</title>
  <!-- note: this exercise uses its OWN stylesheet -->
  <link rel="stylesheet" href="./motion.css" />
</head>
<!--
    EXERCISE 11.2: Loading states & a custom animation (see lessons/11-motion.md)
    1. skeleton card   2. spinner button   3. ping dot   4. custom animation on the bell   5. motion-safe:
  -->

<body class="bg-slate-50 p-10 text-slate-800 dark:bg-slate-950">
  <div class="max-w-md space-y-10">
    <section>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">1 · Skeleton card</p>
      <div class="
          rounded-xl bg-white p-5 shadow-sm
          dark:bg-slate-900
          *:bg-slate-300
          dark:*:bg-slate-700
          grid grid-cols-[auto_1fr]
          motion-safe:*:animate-pulse
      ">
        <!-- build: round avatar placeholder + title bar + 3 text lines of different widths -->
        <div class="row-span-4 mr-4 size-20 rounded-full"></div>
        <div class="mb-3 max-w-40 h-6 rounded-sm"></div>
        <div class="mb-2 max-w-60 h-4 rounded-sm"></div>
        <div class="mb-2 max-w-70 h-4 rounded-sm"></div>
        <div class="max-w-55 h-4 rounded-sm"></div>
      </div>
    </section>

    <section>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">2 · Spinner button</p>
      <button disabled class="
            inline-flex items-center gap-2 rounded-lg 
            px-4 py-2 font-semibold 
            bg-indigo-600 text-white
            dark:bg-indigo-900 dark:text-white/80
        ">
        <span class="
            size-4
            border-4 rounded-full
            border-slate-200 dark:border-white/60
            border-r-transparent dark:border-r-transparent
            motion-safe:animate-spin
        "><!-- spinner --></span>
        Saving…
      </button>
    </section>

    <section>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">3 · Ping dot</p>
      <span class="relative inline-flex">
        <span class="
            rounded-md bg-white px-3 py-1.5 text-sm ring-1 ring-slate-300
            dark:bg-slate-900 dark:ring-slate-800/80
            dark:text-white/80
        ">Inbox</span>
        <!-- build: a small red dot at the top-right corner, with a ping behind it -->
        <span class="
            absolute top-1 right-1
            size-1 rounded-full
            bg-red-600
            dark:bg-red-800
            motion-safe:animate-ping
        "></span>
        <span class="
            absolute top-1 right-1
            size-1 rounded-full
            bg-red-600 ring-1 ring-red-600/20
            dark:bg-red-800 dark:ring-red-800/10
        "></span>
      </span>
    </section>

    <section>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">4 · Custom animation</p>
      <span class="motion-safe:animate-bell inline-block text-4xl">🔔</span>
    </section>
  </div>
</body>

</html>
