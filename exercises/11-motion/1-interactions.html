<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11.1 · Micro-interactions</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<!--
    EXERCISE 11.1: Micro-interactions (see lessons/11-motion.md)
    Add transitions/transforms to each numbered item.
  -->

<body class="bg-slate-50 p-10 dark:bg-slate-950">
  <div class="
      grid max-w-3xl grid-cols-2 gap-8
      [&_button]:cursor-pointer
  ">
    <!-- 1. smooth hover color + press scale -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">1 · Button</p>
      <button class="
          rounded-lg px-5 py-2.5 font-semibold text-white
          bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
          dark:bg-indigo-800 dark:hover:bg-indigo-700/90 dark:active:bg-indigo-700
          active:scale-98 transition
          outline-hidden
          ring-offset-1
          focus-visible:ring-2
          focus-visible:ring-indigo-900
          dark:ring-offset-black
      ">Save changes</button>
    </div>

    <!-- 2. lift + bigger shadow on hover -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">2 · Card</p>
      <div class="
          rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-900/5
          dark:bg-slate-900
          hover:shadow-lg 
          dark:ring-white/5
          dark:hover:ring-2 dark:hover:ring-white/10
          hover:-translate-y-1 transition cursor-pointer
      ">
        <p class="font-semibold dark:text-white">Hover me</p>
        <p class="text-sm text-slate-500 dark:text-white/80">I should float up a little.</p>
      </div>
    </div>

    <!-- 3. arrow slides right when the whole link is hovered -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">3 · Arrow link</p>
      <a href="#" class="
          group
          inline-flex items-center gap-2 font-semibold text-indigo-600
          dark:text-indigo-400
          outline-hidden ring-offset-2 rounded-xs
          focus-visible:ring-2 focus-visible:ring-indigo-900
          dark:ring-offset-black
      ">
        Get started
        <span class="
            group-hover:translate-x-1
            transition-transform
        ">→</span>
      </a>
    </div>

    <!-- 4. gear rotates on hover -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">4 · Gear</p>
      <button class="
          text-3xl
          hover:rotate-30 duration-300 transition-transform
          outline-hidden ring-offset-2 rounded-xs
          focus-visible:ring-2 focus-visible:ring-indigo-900
          dark:ring-offset-black
      ">⚙️</button>
    </div>

    <!-- 5. toggle switch: knob slides when checked (the checkbox is visually hidden but works) -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">5 · Switch</p>
      <label class="relative inline-block h-7 w-12 cursor-pointer">
        <input type="checkbox" class="peer sr-only" />
        <span class="
            absolute inset-0 rounded-full 
            bg-slate-300 peer-checked:bg-indigo-400
            dark:bg-slate-800 dark:peer-checked:bg-slate-700/80
            transition-colors
            peer-focus-visible:ring-2
            peer-focus-visible:ring-offset-2
            peer-focus-visible:ring-indigo-900
            dark:ring-offset-black
        "></span>
        <span class="
            absolute top-1 left-1 size-5 rounded-full bg-white shadow-sm
            dark:bg-slate-600
            dark:peer-checked:bg-indigo-500
            peer-checked:translate-x-5 transition
        "></span>
      </label>
    </div>

    <!-- 6. chevron rotates when <details> is open -->
    <div>
      <p class="mb-2 text-xs font-semibold text-slate-500 uppercase dark:text-slate-400">6 · Accordion</p>
      <details class="
          rounded-lg bg-white p-4 ring-1 ring-slate-900/5 
          group
          dark:bg-slate-900
          dark:ring-white/10
      ">
        <summary class="
            flex cursor-pointer list-none items-center justify-between font-semibold
          dark:text-white
            outline-hidden rounded-xs
            focus-visible:ring-2
            focus-visible:ring-offset-4
            focus-visible:ring-indigo-900
            dark:ring-offset-slate-900
        ">
          What is Tailwind?
          <span class="group-open:rotate-180 transition-transform">⌄</span>
        </summary>
        <p class="
            mt-2 text-sm text-slate-600
            dark:text-white/80
        ">A utility-first CSS framework.</p>
      </details>
    </div>
  </div>
</body>

</html>
