<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01.2 · Translate CSS</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      EXERCISE 01.2: Translate CSS to utilities (see lessons/01-utility-first.md)
      Recreate these styles with Tailwind classes, then delete this <style> block.
      Hint: 0.25rem = 1 spacing unit. #4f46e5 is indigo-600, #eef2ff is indigo-50,
      #f1f5f9 is slate-100, #334155 is slate-700, #cbd5e1 is slate-300.
    -->
    <style>
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background-color: #eef2ff;
        color: #4f46e5;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 9999px;
      }
      .tag {
        display: inline-block;
        margin-left: 0.5rem;
        padding: 0.5rem 1rem;
        background-color: #f1f5f9;
        color: #334155;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: 1px solid #cbd5e1;
        border-radius: 0.375rem;
      }
    </style>
  </head>
  <body class="p-10">
    <span class="badge">New feature</span>
    <span class="tag">v4.0</span>
  </body>
</html>
