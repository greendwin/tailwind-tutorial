<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Course</title>
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
    <main class="mx-auto max-w-3xl px-6 py-12">
      <header class="mb-10">
        <p class="text-sm font-semibold tracking-widest text-sky-600 uppercase">Hands-on course</p>
        <h1 class="mt-1 text-4xl font-bold tracking-tight text-stone-900">Learn Tailwind CSS</h1>
        <p class="mt-3 text-stone-600">
          Read a lesson, do the exercises in your editor, then ask Claude to <code class="rounded bg-stone-200 px-1">check 05.1</code>.
        </p>
        <div class="mt-4 flex gap-3 text-sm">
          <a href="/playground/" class="rounded-md bg-stone-900 px-3 py-1.5 font-medium text-white hover:bg-stone-700">Open playground</a>
          <span id="summary" class="self-center text-stone-500"></span>
        </div>
      </header>
      <ol id="lessons" class="space-y-3"></ol>

      <section class="mt-12">
        <h2 class="text-lg font-bold text-stone-900">Challenges</h2>
        <p class="mt-1 text-sm text-stone-500">
          Ask Claude to <code class="rounded bg-stone-200 px-1">challenge me</code>. Open the target, then recreate it in
          <code class="rounded bg-stone-200 px-1">mine.html</code> without peeking at the target's source.
        </p>
        <ul id="challenges" class="mt-4 space-y-2"></ul>
      </section>
    </main>

    <script type="module">
      import { lessons, challenges } from "/app/course.js";

      document.getElementById("challenges").innerHTML =
        challenges
          .map(
            (c) => `
          <li class="flex items-center gap-3 rounded-lg border border-stone-200 bg-white px-4 py-2 text-sm">
            <span class="flex-1 font-medium">${c}</span>
            <a href="/challenges/${c}/target.html" class="rounded px-2 py-1 text-sky-700 hover:bg-sky-50">target</a>
            <a href="/challenges/${c}/mine.html" class="rounded px-2 py-1 text-sky-700 hover:bg-sky-50">mine</a>
          </li>`,
          )
          .join("") || `<li class="text-sm text-stone-400">No challenges yet.</li>`;

      const badge = {
        done: "bg-emerald-100 text-emerald-800",
        "in progress": "bg-amber-100 text-amber-800",
        todo: "bg-stone-100 text-stone-500",
      };

      const all = lessons.flatMap((l) => l.exercises);
      const done = all.filter((e) => e.status === "done").length;
      document.getElementById("summary").textContent = `${done} / ${all.length} exercises done`;

      document.getElementById("lessons").innerHTML = lessons
        .map(
          (l) => `
          <li>
            <a href="/lesson.html?l=${l.slug}" class="group flex items-center gap-4 rounded-xl border border-stone-200 bg-white p-4 shadow-xs transition hover:border-sky-300 hover:shadow-md">
              <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-stone-100 font-mono text-sm font-bold text-stone-500 group-hover:bg-sky-100 group-hover:text-sky-700">${l.num}</span>
              <span class="flex-1 font-medium">${l.title.replace(/^\d+\s*[·.-]\s*/, "")}</span>
              <span class="flex flex-wrap justify-end gap-1">
                ${l.exercises.map((e) => `<span class="rounded px-1.5 py-0.5 font-mono text-xs ${badge[e.status] ?? badge.todo}">${e.id}</span>`).join("")}
              </span>
            </a>
          </li>`,
        )
        .join("");
    </script>
  </body>
</html>
